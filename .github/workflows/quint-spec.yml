# This job checks the Quint specs only. It does not check that the turso code
# follows the specs. The main configurations take 3.5 to 17 minutes, so they
# are not in this job. Run them by hand with `make check` in specs/.
name: Quint Spec

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "specs/**"
      - ".github/workflows/quint-spec.yml"
  pull_request:
    paths:
      - "specs/**"
      - ".github/workflows/quint-spec.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  quint-spec:
    name: Typecheck and run small variants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: specs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install Quint
        run: npm install -g @informalsystems/quint@0.33.1
      - name: Typecheck the specs
        run: make typecheck
      # Each variant below must fail the invariant that its comment names.
      # Each one finishes in about 15 to 30 seconds.
      - name: Run small variants
        run: >-
          make variants WORKERS=4
          ONLY="noSnapshotClamp noGcWait noBackfillStop setvalRace noDeferDeletes issue11501 issue11502 issue8004 noIndexMark noIndexStamp indexGcNoFloor"
